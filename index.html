nav.tabs button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--acc),#0a4a3d);color:#fff;border:0}

.hero .lbl{opacity:.8;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.2)}
.split i{display:block;background:#fff}

.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}

<script>
/* ---------- ENGINE (pure functions, no DOM) ---------- */
const DAY = 864e5;
const pd = s => s ? new Date(s + 'T00:00:00Z') : null;
const ds = d => d.toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / DAY);
const addDays = (s, n) => ds(new Date(pd(s).getTime() + n * DAY));
const addYears = (s, n) => { const d = pd(s); d.setUTCFullYear(d.getUTCFullYear() + n); return ds(d); };
const yearOf = s => +String(s).slice(0, 4);

/* Safe arithmetic evaluator: digits + - * / ( ) . only */
function evalExpr(t) {
  if (typeof t === 'number') return t;
  t = String(t == null ? '' : t).replace(/[,\s₩]/g, '');
  if (t === '' || !/^[0-9+\-*/().]+$/.test(t) || /\/\/|\*\*/.test(t)) return NaN;
  try { const v = Function('"use strict";return (' + t + ')')(); return isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}

/* ---- Pension tracker (retirement pension + IRP + KOSPI) ---- */
function pensionCalc(list) {
  const rows = list.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const k0 = (rows.find(r => r.kospi != null) || {}).kospi;
  let D = 0, K = 0, prev = null, lastK = null;
  return rows.map(r => {
    D += r.rDep || 0; K += r.iDep || 0;
    const pr = prev ? prev.rBal : 0, pi = prev ? prev.iBal : 0;
    const rDay = r.rBal - pr - (r.rDep || 0), iDay = r.iBal - pi - (r.iDep || 0);
    const prin = D + K, bal = r.rBal + r.iBal, pBal = pr + pi;
    const dayPL = rDay + iDay, cumPL = bal - prin;
    let kDay = null, kCum = null;
    if (r.kospi != null) {
      if (lastK != null) kDay = (r.kospi - lastK) / lastK;
      if (k0) kCum = (r.kospi - k0) / k0;
      lastK = r.kospi;
    }
    const o = {
      id: r.id, date: r.date, rDep: r.rDep || 0, rBal: r.rBal, iDep: r.iDep || 0, iBal: r.iBal, kospi: r.kospi,
      rPrin: D, iPrin: K, prin, bal, dayPL, dayRet: pBal > 0 ? dayPL / pBal : null,
      cumPL, cumRet: prin > 0 ? bal / prin - 1 : null,
      rCum: D > 0 ? r.rBal / D - 1 : null, iCum: K > 0 ? r.iBal / K - 1 : null, kDay, kCum
    };
    prev = r; return o;
  });
}

/* ---- Items ---- */
function itemDates(it, base) {
  if (it.dateMode === 'year') { const Y = yearOf(base); return { s: Y + '-01-01', e: Y + '-12-31' }; }
  return { s: it.start || null, e: it.endToday ? base : (it.end || null) };
}
function itemStatus(it, base) {
  const d = itemDates(it, base);
  if (d.s && d.s > base) return 'scheduled';
  if (d.e && d.e < base) return 'matured';
  return 'active';
}
function itemAmount(it, pen) {
  if (it.kind === 'pension') return it.frozen != null ? it.frozen : (pen ? pen.bal : 0);
  return +it.amount || 0;
}
function itemReturn(it, pen) {
  if (it.kind === 'pension') return it.frozen != null ? (it.frozenRet == null ? null : it.frozenRet) : (pen ? pen.cumRet : null);
  if ((it.kind === 'stock' || it.kind === 'asset') && it.cost) return itemAmount(it, pen) / it.cost - 1;
  return null;
}
/* pre-tax interest booked in calendar year Y (same rule as the Excel sheet) */
function itemInterest(it, Y, base) {
  if (it.kind === 'demand') {
    const y0 = yearOf(base);
    return Y === y0 ? (+it.manual1 || 0) : Y === y0 + 1 ? (+it.manual2 || 0) : 0;
  }
  if (it.kind === 'term' && it.start && it.end && yearOf(it.end) === Y)
    return (+it.amount || 0) * dayDiff(it.start, it.end) * (+it.rate || 0) / 100 / 365;
  return 0;
}
const itemTax = (it, def) => it.tax == null || it.tax === '' ? def : +it.tax;

function totals(items, base, pen, defTax) {
  const Y1 = yearOf(base), Y2 = Y1 + 1;
  const mk = () => ({ liq: 0, ill: 0, total: 0, i1: 0, i1n: 0, i2: 0, i2n: 0 });
  const T = { all: mk() };
  items.forEach(it => {
    const o = T[it.owner] || (T[it.owner] = mk());
    const act = itemStatus(it, base) === 'active';
    const a = itemAmount(it, pen);
    [o, T.all].forEach(x => {
      if (act) { if (it.group === 'liquid') x.liq += a; else x.ill += a; }
      const t = itemTax(it, defTax);
      const a1 = itemInterest(it, Y1, base), a2 = itemInterest(it, Y2, base);
      x.i1 += a1; x.i1n += a1 * (100 - t) / 100; x.i2 += a2; x.i2n += a2 * (100 - t) / 100;
    });
  });
  Object.values(T).forEach(x => x.total = x.liq + x.ill);
  return T;
}

/* ---- 100-year plan (units: 10,000 KRW) ---- */
function planCalc(plan) {
  let P = +plan.start || 0;
  return plan.rows.map(y => {
    const st = P, intr = (st - (+y.special || 0)) * (+y.ret || 0) * (1 - (+y.tax || 0));
    const end = st + intr + (+y.p1 || 0) + (+y.p2 || 0) + (+y.inc || 0) - (+y.spend || 0) - (+y.special || 0);
    P = end;
    return { st, intr, end, net: end + (+y.re || 0) };
  });
}

/* ---- Snapshot: freeze pension value so history stays exact ---- */
function freezeItems(items, pen) {
  return items.map(it => {
    const c = JSON.parse(JSON.stringify(it));
    if (c.kind === 'pension') { c.frozen = pen ? pen.bal : 0; c.frozenRet = pen ? pen.cumRet : null; c.amount = c.frozen; }
    return c;
  });
}

    if ((el = q('[data-set]'))) { S[el.dataset.set] = el.dataset.val; persist(); render(); return; }
    if ((el = q('[data-act]'))) {
      const a = el.dataset.act;
      ({
        addItem: () => openItem(null), addMember, fs: toggleFs, toggleInactive: () => { ui.hideInactive = !ui.hideInactive; render(); }, addPen: () => openPen(null), penAll: () => { ui.penAll = true; render(); },
        bulk: openBulk, planNotes: openNotes, base: openBase, saveSnap, expJson: () => { download('finance_' + stamp() + '.json', JSON.stringify(S), 'application/json').then(ok => { if (ok) { markBackup(); toast('백업 파일을 저장했습니다'); } }); },
        shareJson, impJson: () => $('#impFile').click(), csv: () => doCSV(el.dataset.w),
        clearAll: () => {
          if (!confirm('자산 항목, 퇴직연금 기록, 100세 계획, 이력(스냅샷)을 모두 삭제합니다.\n되돌릴 수 없습니다. (가족 이름과 표시 설정은 유지됩니다)\n\n계속할까요?')) return;
          if (!confirm('정말 모두 삭제할까요?\n필요하면 먼저 백업을 저장해 두세요.')) return;
          const y = new Date().getFullYear();
          S.items = []; S.pension = []; S.snapshots = [];
          S.plan = { start: 0, notes: [], rows: Array.from({ length: 49 }, (_, i) => ({ year: y + i, age: 50 + i, ret: 0.03, tax: 0.154, p1: 0, p2: 0, inc: 0, spend: 0, special: 0, re: 0, remark: '' })) };
          S.base = todayISO(); S.created = todayISO(); S.lastBackup = null; ui.penAll = false;
          persist(); render(); toast('모든 데이터를 삭제했습니다');
        },
        reset: () => { if (confirm('모든 데이터를 초기 엑셀 데이터로 되돌릴까요? 되돌릴 수 없습니다.')) { S = freshState(); S.owners = { ...OWNER_KO }; delete S.members; ensureMembers(); ui.owners = ['me']; S.unit = 'full'; S.gain = 'red'; S.defTax = 15.4; persist(); render(); toast('초기화되었습니다'); } }
      })[a]();
    }
  });
  document.addEventListener('change', e => {
    planChange(e);
    if (e.target.id === 'impFile' && e.target.files[0]) importJson(e.target.files[0]);
    if (e.target.id === 's_tax') { const v = num(e.target.value); if (!isNaN(v)) { S.defTax = v; persist(); toast('저장됨'); } }
    if (e.target.dataset.own) { S.owners[e.target.dataset.own] = e.target.value.trim() || e.target.dataset.own; persist(); }
  });
  render();
}
init();
